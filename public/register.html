<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Register - ShetiBook</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-logo">🌱 <span>ShetiBook</span></a>
    <div class="nav-links">
      <a href="/" data-i18n="nav_home">Home</a>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="hi">हि</button>
        <button class="lang-btn" data-lang="mr">मर</button>
      </div>
    </div>
  </nav>
  <div class="auth-page">
    <div class="auth-card card card-glass">
      <h1 data-i18n="register_title">Join ShetiBook</h1>
      <p class="subtitle" data-i18n="register_subtitle">Create your farmer account</p>
      <form id="register-form">
        <div class="form-group">
          <label data-i18n="name">Full Name</label>
          <input type="text" name="fullname" class="form-control" required>
        </div>
        <div class="form-group">
          <label data-i18n="email">Email Address</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label data-i18n="phone">Phone Number</label>
          <input type="tel" name="phone" class="form-control">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label data-i18n="state">State</label>
            <input type="text" name="state" class="form-control">
          </div>
          <div class="form-group">
            <label data-i18n="district">District</label>
            <input type="text" name="district" class="form-control">
          </div>
        </div>
        <div class="form-group">
          <label data-i18n="password">Password</label>
          <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="form-group">
          <label data-i18n="confirm_password">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" data-i18n="register_btn">Create Account</button>
      </form>
      <p class="auth-footer"><span data-i18n="have_account">Already have an account?</span> <a href="/login.html" data-i18n="nav_login">Login</a></p>
    </div>
  </div>
  <script src="/js/i18n.js"></script><script src="/js/app.js"></script><script src="/js/auth.js"></script>
</body>
</html>
