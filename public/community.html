<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Community - ShetiBook</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-logo">🌱 <span>ShetiBook</span></a>
    <button class="mobile-toggle">☰</button>
    <div class="nav-links">
      <a href="/" data-i18n="nav_home">Home</a>
      <a href="/diagnose.html" data-i18n="nav_diagnose">Diagnose</a>
      <a href="/crops.html" data-i18n="nav_crops">Crops</a>
      <a href="/community.html" class="active" data-i18n="nav_community">Community</a>
      <a href="/schemes.html" data-i18n="nav_schemes">Schemes</a>
      <a href="/vendors.html" data-i18n="nav_vendors">Vendors</a>
      <a href="/dashboard.html" class="auth-only" data-i18n="nav_dashboard">Dashboard</a>
      <a href="/login.html" class="guest-only btn btn-outline btn-sm" data-i18n="nav_login">Login</a>
      <a href="/register.html" class="guest-only btn btn-primary btn-sm" data-i18n="nav_register">Register</a>
      <button class="logout-btn auth-only btn btn-sm" style="color:var(--danger)" data-i18n="nav_logout">Logout</button>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="hi">हि</button>
        <button class="lang-btn" data-lang="mr">मर</button>
      </div>
    </div>
  </nav>
  
  <div class="page-content container" style="max-width:800px">
    <div class="section-title" data-i18n="community_title">Farmer Community</div>
    <div class="section-subtitle" data-i18n="community_subtitle">Share knowledge, ask questions, and help each other</div>
    
    <div class="card auth-only" style="margin-bottom:2rem;background:rgba(255,255,255,.02)">
      <h3 style="margin-bottom:1rem">📝 <span data-i18n="create_post">Create Post</span></h3>
      <form id="post-form">
        <div class="form-group">
          <input type="text" name="title" class="form-control" required placeholder="Post Title" data-i18n="post_title">
        </div>
        <div class="form-group">
          <textarea name="content" class="form-control" rows="3" required placeholder="Write your post..." data-i18n="post_content"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <select name="category" class="form-control">
              <option value="general" data-i18n="cat_general">General</option>
              <option value="questions" data-i18n="cat_questions">Questions</option>
              <option value="tips" data-i18n="cat_tips">Tips</option>
              <option value="success" data-i18n="cat_success">Success Stories</option>
              <option value="market" data-i18n="cat_market">Market Info</option>
            </select>
          </div>
          <div class="form-group" style="flex:2;display:flex;align-items:center;gap:10px">
            <input type="file" name="image" id="post-img" class="form-control" accept="image/*" style="display:none" onchange="document.getElementById('post-img-name').textContent=this.files[0]?.name||''">
            <button type="button" class="btn btn-outline" onclick="document.getElementById('post-img').click()">📸 Photo</button>
            <span id="post-img-name" style="font-size:.85rem;color:var(--text-muted)"></span>
          </div>
        </div>
        <div style="text-align:right">
          <button type="submit" class="btn btn-primary" data-i18n="post_btn">Post</button>
        </div>
      </form>
    </div>
    
    <div class="guest-only card" style="text-align:center;margin-bottom:2rem;background:rgba(64,145,108,.1);border-color:rgba(64,145,108,.3)">
      <h3 style="margin-bottom:.5rem">Join the conversation</h3>
      <p style="margin-bottom:1rem;color:var(--text-muted)">Please login to create posts and comments</p>
      <a href="/login.html" class="btn btn-primary btn-sm" data-i18n="nav_login">Login</a>
    </div>
    
    <div class="tabs">
      <button class="tab community-tab active" data-category="" data-i18n="all_crops">All</button>
      <button class="tab community-tab" data-category="questions" data-i18n="cat_questions">Questions</button>
      <button class="tab community-tab" data-category="tips" data-i18n="cat_tips">Tips</button>
      <button class="tab community-tab" data-category="market" data-i18n="cat_market">Market Info</button>
    </div>
    
    <div id="posts-feed">
      <div style="text-align:center;padding:3rem">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
  
  <script src="/js/i18n.js"></script><script src="/js/app.js"></script><script src="/js/community.js"></script><script src="/js/chatbot.js"></script>
</body>
</html>
