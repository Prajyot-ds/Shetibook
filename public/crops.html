<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Crops - ShetiBook</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <nav class="navbar">
    <a href="/" class="nav-logo">🌱 <span>ShetiBook</span></a>
    <button class="mobile-toggle">☰</button>
    <div class="nav-links">
      <a href="/" data-i18n="nav_home">Home</a>
      <a href="/diagnose.html" data-i18n="nav_diagnose">Diagnose</a>
      <a href="/crops.html" class="active" data-i18n="nav_crops">Crops</a>
      <a href="/community.html" data-i18n="nav_community">Community</a>
      <a href="/schemes.html" data-i18n="nav_schemes">Schemes</a>
      <a href="/vendors.html" data-i18n="nav_vendors">Vendors</a>
      <a href="/dashboard.html" class="auth-only" data-i18n="nav_dashboard">Dashboard</a>
      <a href="/login.html" class="guest-only btn btn-outline btn-sm" data-i18n="nav_login">Login</a>
      <a href="/register.html" class="guest-only btn btn-primary btn-sm" data-i18n="nav_register">Register</a>
      <button class="logout-btn auth-only btn btn-sm" style="color:var(--danger)" data-i18n="nav_logout">Logout</button>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="hi">हि</button>
        <button class="lang-btn" data-lang="mr">मर</button>
      </div>
    </div>
  </nav>

  <div class="page-content container">
    <div class="section-title" data-i18n="crops_title">Crop Encyclopedia</div>
    <div class="section-subtitle" data-i18n="crops_subtitle">Learn about crops grown across India</div>

    <div class="search-box">
      <input type="text" id="crop-search" class="form-control" placeholder="Search crops..." data-i18n="search_crops">
    </div>

    <div class="tabs">
      <button class="tab crop-tab active" data-category="all" data-i18n="all_crops">All</button>
      <button class="tab crop-tab" data-category="grains" data-i18n="grains">Grains</button>
      <button class="tab crop-tab" data-category="vegetables" data-i18n="vegetables">Vegetables</button>
      <button class="tab crop-tab" data-category="cashcrops" data-i18n="cash_crops">Cash Crops</button>
      <button class="tab crop-tab" data-category="oilseeds" data-i18n="oilseeds">Oilseeds</button>
    </div>

    <div id="crops-grid" class="grid grid-3">
      <div style="text-align:center;grid-column:1/-1;padding:3rem">
        <div class="spinner"></div>
        <p class="loading-text" data-i18n="loading">Loading...</p>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/crops.js"></script>
  <script src="/js/chatbot.js"></script>
</body>

</html>
