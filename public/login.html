<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login - ShetiBook</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-logo">🌱 <span>ShetiBook</span></a>
    <div class="nav-links">
      <a href="/" data-i18n="nav_home">Home</a>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="hi">हि</button>
        <button class="lang-btn" data-lang="mr">मर</button>
      </div>
    </div>
  </nav>
  <div class="auth-page">
    <div class="auth-card card card-glass">
      <h1 data-i18n="login_title">Welcome Back</h1>
      <p class="subtitle" data-i18n="login_subtitle">Login to your ShetiBook account</p>
      <div id="login-alert"></div>
      <form id="login-form">
        <div class="form-group">
          <label data-i18n="email">Email Address</label>
          <input type="email" name="email" class="form-control" required placeholder="farmer@example.com">
        </div>
        <div class="form-group">
          <label data-i18n="password">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" data-i18n="login_btn">Login</button>
      </form>
      <p class="auth-footer"><span data-i18n="no_account">Don't have an account?</span> <a href="/register.html" data-i18n="nav_register">Register</a></p>
    </div>
  </div>
  <script src="/js/i18n.js"></script><script src="/js/app.js"></script><script src="/js/auth.js"></script>
</body>
</html>
