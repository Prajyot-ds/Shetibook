<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShetiBook</title>
  <meta name="description" content="Login to ShetiBook - Digital Agriculture Assistant for Indian Farmers">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-logo">🌱 <span>ShetiBook</span></a>
    <div class="nav-links">
      <a href="/" data-i18n="nav_home">Home</a>
      <a href="/crops.html" data-i18n="nav_crops">Crops</a>
      <a href="/schemes.html" data-i18n="nav_schemes">Schemes</a>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="hi">हि</button>
        <button class="lang-btn" data-lang="mr">मर</button>
      </div>
    </div>
  </nav>

  <!-- Login Page Container -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge-icon">🌾</div>
        <h1 data-i18n="login_title">Welcome Back</h1>
        <p class="subtitle" data-i18n="login_subtitle">Login to your ShetiBook farming account</p>
      </div>

      <!-- Shown if user is already logged in -->
      <div id="already-logged-in-box" style="display:none; text-align:center; padding:1.5rem 0;">
        <div class="auth-alert success active" style="margin-bottom:1.5rem;">
          <span>✅ You are already logged in as <strong id="logged-user-name">User</strong></span>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <a href="/dashboard.html" class="btn btn-primary" style="justify-content:center;">Go to Dashboard ➔</a>
          <button type="button" class="btn btn-outline" id="switch-account-btn" style="justify-content:center;">Log In with Different Account</button>
        </div>
      </div>

      <!-- Main Login Form Area -->
      <div id="login-form-area">
        <!-- In-card Alert Box for Feedback -->
        <div id="login-alert" class="auth-alert" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email" data-i18n="email">Email Address</label>
            <input 
              type="email" 
              id="login-email" 
              name="email" 
              class="form-control" 
              required 
              placeholder="farmer@example.com"
              autocomplete="email" 
              autofocus
            >
          </div>

          <div class="form-group">
            <label for="login-password" data-i18n="password">Password</label>
            <div class="password-field-wrapper">
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                class="form-control" 
                required 
                placeholder="••••••••"
                autocomplete="current-password"
              >
              <button 
                type="button" 
                class="password-toggle-btn" 
                id="toggle-password-btn" 
                title="Show / Hide Password" 
                aria-label="Toggle password visibility"
              >👁️</button>
            </div>
          </div>

          <!-- Quick Demo Helper Box -->
          <div class="demo-credentials-box">
            <div class="demo-credentials-header">
              <span class="demo-credentials-title">⚡ Quick Demo Account</span>
              <button type="button" id="fill-demo-btn" class="demo-autofill-btn">1-Click Auto Fill</button>
            </div>
            <p class="demo-credentials-info">
              Email: <code>test@example.com</code><br>
              Password: <code>password123</code>
            </p>
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width:100%;justify-content:center;">
            <span id="btn-text" data-i18n="login_btn">Login</span>
          </button>
        </form>

        <p class="auth-footer">
          <span data-i18n="no_account">Don't have an account?</span>
          <a href="/register.html" data-i18n="nav_register">Register Free</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
